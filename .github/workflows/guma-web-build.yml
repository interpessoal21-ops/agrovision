name: GUMA Web Build

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "index.html"
      - "vite.config.js"
      - "src/**"
      - ".github/workflows/guma-web-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "index.html"
      - "vite.config.js"
      - "src/**"
      - ".github/workflows/guma-web-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web edition
        run: npm run build
