name: Validate AGROVISION

concurrency:
  group: guma-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, spaceapps-2026-rotation-lab]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and validation module
        run: python -m py_compile scripts/smoke_test_data_sources.py app.py guma_brand.py guma_earth_data.py pages/01_Trend_Detective.py pages/02_Earth_Data_Observatory.py agrovision_validation.py agrovision_agronomy.py agrovision_zarc.py agrovision_modis.py agrovision_quality.py agrovision_rotation.py agrovision_climate.py agrovision_commons.py agrovision_fieldlab.py agrovision_atlas.py
      - name: Run scientific-validation metric tests
        run: python -m unittest discover -s tests -v
      - name: Run Streamlit visitor startup smoke test
        run: python -m unittest tests.test_app_startup tests.test_page_import_contracts -v

  live-data-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install smoke-test dependency
        run: python -m pip install requests pandas
      - name: Check live NASA POWER and MODIS endpoints
        run: python scripts/smoke_test_data_sources.py
