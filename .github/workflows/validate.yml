name: Validate AGROVISION

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and validation module
        run: python -m py_compile app.py agrovision_validation.py
      - name: Run scientific-validation metric tests
        run: python -m unittest discover -s tests -v
