name: Validate AGROVISION

on:
  push:
    branches: [main, spaceapps-2026-rotation-lab]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and validation module
        run: python -m py_compile scripts/smoke_test_data_sources.py app.py agrovision_validation.py agrovision_agronomy.py agrovision_zarc.py agrovision_modis.py agrovision_quality.py agrovision_rotation.py agrovision_climate.py
      - name: Run scientific-validation metric tests
        run: python -m unittest discover -s tests -v

  live-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependency
        run: python -m pip install requests
      - name: Check live NASA POWER and MODIS endpoints
        run: python scripts/smoke_test_data_sources.py
